name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:


	- name: Security Scan
  	  run: bandit -r backend
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Linting
 	run: flake8 backend

      - name: Run Tests
        run: pytest tests

	- name: Run Tests
        run: |
          pytest tests/

      - name: Build Docker Image
        run: |
          docker build -t flask-devops-app ./backend