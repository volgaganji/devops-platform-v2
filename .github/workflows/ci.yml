name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: devops_pass
          POSTGRES_DB: devops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U devops_user -d devops_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_NAME: devops_db
      DB_USER: devops_user
      DB_PASSWORD: devops_pass
      DB_PORT: 5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Linting
        run: |
          flake8 backend --max-line-length=88

      - name: Security Scan
        run: |
          bandit -r backend

      - name: Run Tests
        run: |
          pytest tests/

      - name: Build Docker Image
        run: |
          docker build -t flask-devops-app ./backend

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag Docker Image
        run: |
          docker tag flask-devops-app ${{ secrets.DOCKER_USERNAME }}/devops-platform-v2:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-platform-v2:latest